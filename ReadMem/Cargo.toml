[package]
name = "d2r-health-reader"
version = "0.1.0"
edition = "2021"
authors = ["D2Tools"]
description = "Diablo 2 Resurrected Health Reader"
license = "MIT"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
]

[profile.release]
opt-level = 3
lto = true
